[package]
name = "thoosa_shared"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[features]
mock_global_ctx = []
rusqlite-error = ["dep:rusqlite"]
tch-error = ["dep:tch"]
serde-json-error = ["dep:serde_json"]
serde-json5-error = ["dep:serde_json5"]
polars-error = ["dep:polars"]
lewton-error = ["dep:lewton"]
ogg-error = ["dep:ogg"]
hound-error = ["dep:hound"]

[dependencies]
thoosa_with_data = {path  = "../thoosa_macros/thoosa_with_data"}
cached_derive = {path  = "../thoosa_macros/cached_derive"}
ctor = "0.2.6"
bytemuck.workspace = true
regex.workspace = true
rand = {workspace = true}
rand_mt = "4.2.2"
log = {workspace = true}
chrono.workspace = true
clap.workspace = true
num-traits.workspace = true
lazy_static = "1.5.0"
plotters.workspace = true
parking_lot.workspace = true
serde.workspace = true
once_cell = "1.20.2"
mockall.workspace = true
mockall_double.workspace = true
rayon.workspace = true
dashmap.workspace = true
crossbeam.workspace = true
crossbeam-channel.workspace = true
futures.workspace = true
futures-util.workspace = true
async-trait.workspace = true
time.workspace = true
ambassador.workspace = true
uuid.workspace = true
thoosa_dummy_data_derive.workspace = true
