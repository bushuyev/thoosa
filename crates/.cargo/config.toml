# Host-side proc macros also compile thoosa_shared with generic_const_exprs.
# Select the same solver rustc already falls back to, without its compatibility warning.
target-applies-to-host = false

[unstable]
host-config = true
target-applies-to-host = true

[host]
rustflags = ["-Znext-solver=coherence"]

[build]
target = "x86_64-unknown-linux-gnu"
target-dir = "target"
rustflags = [
    "-C", "link-arg=-Wl,--no-as-needed", "--cfg", "tokio_unstable",
    "-C", "force-frame-pointers=yes",
#    "-Z", "sanitizer=address",
#    "-C", "debuginfo=2", //set in Cargo.toml profile.release
#    "-C", "link-arg=-Wl,-rpath,$LIBTORCH",
#    "--cfg", "tho_debug_plots",
    "-Zhigher-ranked-assumptions",
    # Rust 1.100 nightly enables the next trait solver globally, but this workspace still uses generic_const_exprs and async GAT bounds that it cannot prove yet.
    "-Znext-solver=coherence"
]

[env]
LIBTORCH_BYPASS_VERSION_CHECK="1"
#set in ~/.cargo/config.toml
#LIBTORCH=".../libtorch-2.7.1/"
#LD_PRELOAD="$LIBTORCH/lib/libtorch_cpu.so:$LIBTORCH/lib/libtorch_cuda.so"
