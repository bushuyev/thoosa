[workspace]
resolver = "2"

members = [
    "hbac_shared",
    "hbac_common",
    "hbac_store",
    "hbac_motifs",
    "hbac_main",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
rand = "0.8.5"
log = "0.4.22"
simplelog = "0.12.2"
chrono = { version = "0.4.38" }
tch = { version = "0.16.0" }
torch-sys = "0.16.0"
parking_lot =  "0.12.3"
parking_lot_mpsc =  "0.1.5"
crossbeam-utils = "0.8.19"
crossbeam = "0.8.4"
crossbeam-channel = "0.5.11"
futures = "0.3.30"

[profile.test]
opt-level = 0