[workspace]
resolver = "2"

members = [
    "thoosa_shared",
    "thoosa_common",
    "thoosa_store",
    "thoosa_motifs",
    "thoosa_main",

    "thoosa_macros/thoosa_macros_utils",
    "thoosa_macros/thoosa_run_config_args",
    "thoosa_macros/thoosa_run_config_args_derive",
    "thoosa_macros/thoosa_properties_map",
    "thoosa_macros/thoosa_properties_map_derive",

    "thoosa_projects/thoosa_hbac",
    "thoosa_projects/thoosa_bird_clef",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
rayon = "1.10.0"
rand = "0.8.5"
log = "0.4.25"
simplelog = "0.12.2"
chrono = { version = "0.4.38" }
tch = "0.18.1"
torch-sys = "0.18.1"
#tch = { path="../../tch-rs", features = ["cuda-tests"] }
#torch-sys = { path="../../tch-rs/torch-sys" }
parking_lot =  "0.12.3"
crossbeam-utils = "0.8.19"
crossbeam = "0.8.4"
crossbeam-channel = "0.5.13"
futures = "0.3.31"
clap = { version = "4.5.28", features = ["derive", "cargo"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.111"
serde_json5 = "0.1.0"

lazy_static = "1.5.0"
num-traits = "0.2.19"
regex = "1.11.1"
bytemuck = { version = "1.20.0", features = ["derive"] }
cudarc = { version = "0.12.1", features = ["cuda-12060"] }
ctor = "0.4.1"

syn = {version="2.0.99", features=["full"]}
quote = "1.0.39"

libloading = "0.8.6"
plotters = { version = "0.3.7"}
mockall = "0.13.1"
mockall_double = "0.3.1"

#TODO move to polars_utils
polars = { version = "0.46.0", features = ["lazy", "parquet", "csv", "streaming", "polars-ops", "random", "partition_by", "is_in", "list_sample", "list_gather", "list_count", "list_sets", "list_any_all", "dtype-array"] }
[profile.test]
opt-level = 0
