[workspace]
resolver = "2"

members = [
    "thoosa_shared",
    "thoosa_common",
    "thoosa_store",
    "thoosa_motifs",
    "thoosa_main",
    "thoosa_projects/thoosa_hbac"
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
rayon = "1.10.0"
rand = "0.8.5"
log = "0.4.22"
simplelog = "0.12.2"
chrono = { version = "0.4.38" }
tch = "0.18.0"
torch-sys = "0.18.0"
#tch = { path="../../tch-rs", features = ["cuda-tests"] }
#torch-sys = { path="../../tch-rs/torch-sys" }
parking_lot =  "0.12.3"
parking_lot_mpsc =  "0.1.5"
crossbeam-utils = "0.8.19"
crossbeam = "0.8.4"
crossbeam-channel = "0.5.11"
futures = "0.3.30"
clap = { version = "4.5.17", features = ["derive", "cargo"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
lazy_static = "1.5.0"
num-traits = "0.2.19"
regex = "1.11.1"
cudarc = { version = "0.12.1", features = ["cuda-12060"] }
[profile.test]
opt-level = 0