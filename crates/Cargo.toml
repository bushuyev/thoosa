[workspace]
resolver = "3"

members = [
    "thoosa_shared",
    "thoosa_common",
    "thoosa_store",
    "thoosa_motifs",
    "thoosa_main",

    "thoosa_macros/thoosa_macros_utils",
    "thoosa_macros/thoosa_run_config_args",
    "thoosa_macros/thoosa_run_config_args_derive",
    "thoosa_macros/thoosa_dummy_data_derive",
    "thoosa_macros/thoosa_properties_map",
    "thoosa_macros/thoosa_properties_map_derive",
    "thoosa_macros/thoosa_with_data",
    "thoosa_macros/macros_tests",
    "thoosa_macros/cached_derive",
    "thoosa_macros/thoosa_named_derive",
    "thoosa_projects/thoosa_hbac",
#    "thoosa_projects/thoosa_bird_clef",
    "thoosa_macros/macros_tests",
    "thoosa_shims", "thoosa_macros/thoosa_with_data",
]

[workspace.package]
version = "0.1.0"
edition = "2024"


[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    "cfg(thoosa_release_extra)",
]

[workspace.dependencies]
cached_derive = { path = "thoosa_macros/cached_derive" }
thoosa_named_derive = { path = "thoosa_macros/thoosa_named_derive" }
thoosa_dummy_data_derive = { path = "thoosa_macros/thoosa_dummy_data_derive" }

rayon = "1"
rand = { version = "0.10" }
rand_distr = "0.6"
log = "0"
chrono = { version = "0" }
tch = "0.20"
torch-sys = "0.20"
#tch = { path="../../tch-rs", features = ["cuda-tests"] }
#torch-sys = { path="../../tch-rs/torch-sys" }
parking_lot =  "0"
crossbeam-utils = "0"
crossbeam = "0.8.4"
crossbeam-channel = "0"
futures = "0"
futures-util = "0"
async-trait = "0"
clap = { version = "4", features = ["derive", "cargo"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json5 = "0"

lazy_static = "1"
num-traits = "0"
regex = "1"
bytemuck = { version = "1", features = ["derive"] }
cudarc = { version = "0", features = ["cuda-12040"] }
ctor = "0"

syn = {version="2", features=["full"]}
quote = "1"

libloading = "0"
plotters = { version = "0"}
mockall = { version = "0", features = ["nightly"] }
mockall_double = "0"
ambassador = "0"
dashmap = "6"
#TODO move to polars_utils
polars = { version = "0", features = ["lazy", "parquet", "csv", "streaming", "polars-ops", "random", "partition_by", "is_in", "list_sample", "list_gather", "list_count", "list_sets", "list_any_all", "dtype-array"] }

tokio = { version = "1", features = ["full", "test-util", "tracing"] }
tokio-utils = "0"
tracing = "0"
tracing-subscriber = { version = "0", features = ["fmt", "env-filter", "chrono"] }
tracing-appender = "0"
tracing-log = "0"
console-subscriber = "0"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
statrs = "0"
proc-macro2 = {version = "1.0.103"}
time="0"
libc = "0.2.175"
[profile.test]
opt-level = 0
[profile.dev]
opt-level = 0
debug = 2
overflow-checks = true
[profile.release]
debug = 2
strip = "none"
lto = false
panic = "unwind"