[package]
#TODO rename to tch_utils
name = "hbac_common"
version = "0.1.0"
edition = "2021"


[lib]
path = "src/lib.rs"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hbac_shared = {path = "../hbac_shared"}
log = "0.4.20"
simplelog = "0.12.1"
plotters = { version = "0.3.5"}
tch = { version = "0.16.0" }
torch-sys = "0.16.0"
chrono = { version = "0.4.32" }
ctor = "0.2.6"
clap = { version = "4.5.0", features = ["derive", "cargo"] }
rand = "0.8.5"
rand_mt = "4.2.2"
statrs = "0.16.0"
rayon = "1.8.1"
regex = "1.10.3"
serde = "1.0.197"
serde_json = "1.0.111"
nalgebra = "0.32.5"
#linfa = "0.7.0"
argmin = "0.10.0"
argmin-math = { version = "0.4.0", features = ["vec"] }
num-traits = "0.2.19"