[package]
name = "hbac_train"
version = "0.1.0"
edition = "2021"


[dependencies]
polars = { version = "0.36.2", features = ["lazy", "parquet", "csv", "streaming", "polars-ops", "random", "partition_by", "is_in", "list_sample", "list_gather", "list_count", "list_sets", "list_any_all", "dtype-array"] }
tch = { version = "0.14.0" }
#torch-sys = "0.14.0"
#sci-rs = "0.3.8"
plotters = { version = "0.3.5"}
rand = "0.8.5"

log = "0.4.20"
simplelog = "0.12.1"

#serde = "1"
anyhow = "1.0.79"
ctor = "0.2.6"
hbac_motiffs = {path = "../hbac_motiffs"}
clap = { version = "4.5.0", features = ["derive"] }


[dev-dependencies]
rand_chacha = "0.3.1"
approx = "0.5.1"

[build-dependencies]
chrono = { version = "0.4.32" }

[profile.test]
opt-level = 0
