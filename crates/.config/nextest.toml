# .config/nextest.toml
experimental = ["wrapper-scripts"]

[test-groups]
heavy = { max-threads = 1 }

[profile.default]
test-threads = 3
default-filter = 'not test(/::heavy[^:]*$/)'
#retries = 3


[profile.stress]
test-threads = 32
default-filter = 'test(/::heavy[^:]*$/)'
retries = 0

[[profile.default.scripts]]
filter = 'all()'
run-wrapper = 'systemd'

[scripts.wrapper.passthrough]
command = ["bash", "-c", 'exec "$0" "$@"']

[profile.codex]
retries = 0

# Override inherited wrapper script rule from profile.default.
[[profile.codex.scripts]]
filter = 'all()'
run-wrapper = 'passthrough'

[profile.heavy]
default-filter = 'test(/::heavy[^:]*$/)'
retries = 3

[[profile.heavy.overrides]]
filter = 'test(/::heavy[^:]*$/)'
threads-required = "num-cpus"

[scripts.wrapper.systemd]
command = [
    "systemd-run",
    "--user",
    "--scope",
    "-p", "MemoryMax=16G",
    "-p", "MemorySwapMax=64G",
    "-p", "AllowedCPUs=0-16",
    "--"
]
