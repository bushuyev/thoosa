# .config/nextest.toml
experimental = ["wrapper-scripts"]

# Optional: keep a dedicated group for true mutual-exclusion cases.
# (Only matters if you actually assign tests to it via an override.)
[test-groups]
heavy = { max-threads = 1 }   # never run two heavy tests at once (if used)

# Default profile: run all non-heavy tests with at most 3 concurrent threads,
# and retry failures up to 3 times.
[profile.default]
test-threads = 3         # global concurrency for this profile
default-filter = 'not test(/::heavy[^:]*$/)'
retries = 3

[[profile.default.scripts]]
filter = 'all()'
run-wrapper = 'systemd'

# Heavy profile: only heavy tests, each monopolizes all threads; also retries=3.
[profile.heavy]
default-filter = 'test(/::heavy[^:]*$/)'
retries = 3

[[profile.heavy.overrides]]
filter = 'test(/::heavy[^:]*$/)'
threads-required = "num-cpus"  # occupy all scheduler slots when a heavy test runs

[scripts.wrapper.systemd]
command = [
    "systemd-run",
    "--user",
    "--scope",
    "-p", "MemoryMax=16G",
    "-p", "MemorySwapMax=64G",
    "-p", "AllowedCPUs=0-16",
    "--"
]
