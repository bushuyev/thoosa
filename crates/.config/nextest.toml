# .config/nextest.toml
experimental = ["wrapper-scripts"]

[test-groups]
heavy = { max-threads = 1 }

[profile.default]
test-threads = 3
default-filter = 'not test(/::heavy[^:]*$/)'
retries = 3

[[profile.default.scripts]]
filter = 'all()'
run-wrapper = 'systemd'

# NEW: same as default, but no wrapper scripts (good for Codex / environments where systemd-run breaks).
[profile.codex]
test-threads = 3
default-filter = 'not test(/::heavy[^:]*$/)'
retries = 3

[profile.heavy]
default-filter = 'test(/::heavy[^:]*$/)'
retries = 3

[[profile.heavy.overrides]]
filter = 'test(/::heavy[^:]*$/)'
threads-required = "num-cpus"

[scripts.wrapper.systemd]
command = [
    "systemd-run",
    "--user",
    "--scope",
    "-p", "MemoryMax=16G",
    "-p", "MemorySwapMax=64G",
    "-p", "AllowedCPUs=0-16",
    "--"
]
