[package]
name = "hbac_main"
version.workspace = true
edition.workspace = true


[dependencies]
hbac_common = {path = "../hbac_common"}
hbac_motifs = {path = "../hbac_motifs"}
hbac_store = {path = "../hbac_store"}
hbac_shared = {path = "../hbac_shared"}

rand.workspace = true
polars = { version = "0.36.2", features = ["lazy", "parquet", "csv", "streaming", "polars-ops", "random", "partition_by", "is_in", "list_sample", "list_gather", "list_count", "list_sets", "list_any_all", "dtype-array"] }
tch = { version = "0.16.0" }
#torch-sys = "0.14.0"
#sci-rs = "0.3.8"
plotters = { version = "0.3.5"}


log = "0.4.20"
simplelog = "0.12.1"

#serde = "1"
anyhow = "1.0.79"
ctor = "0.2.6"

clap = { version = "4.5.0", features = ["derive"] }
regex = "1.10.3"
serde_json = "1.0.111"


[dev-dependencies]
rand_chacha = "0.3.1"
approx = "0.5.1"

[build-dependencies]
chrono.workspace = true

[profile.test]
opt-level = 0
