[package]
name = "hbac_motifs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
hbac_common = {path = "../hbac_common"}
hbac_store = {path = "../hbac_store"}
tch = { version = "0.14.0" }
torch-sys = "0.14.0"
sci-rs = "0.3.8"
plotters = { version = "0.3.5"}
rand = "0.8.5"

log = "0.4.20"
simplelog = "0.12.1"

anyhow = "1.0.79"
ctor = "0.2.6"
chrono = { version = "0.4.32" }
rayon = "1.8.1"

crossbeam-utils = "0.8.19"
crossbeam = "0.8.4"
crossbeam-channel = "0.5.11"
futures = "0.3.30"
clap = { version = "4.5.0", features = ["derive"] }
regex = "1.10.3"



[dev-dependencies]
rand_chacha = "0.3.1"
approx = "0.5.1"

[build-dependencies]
chrono = { version = "0.4.32" }

[profile.test]
opt-level = 0