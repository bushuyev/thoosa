t="spacing" textLength="151.8251" x="317.338" y="841.4992">Apply CollectionErrorPolicy</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="123.8169" x="317.338" y="857.8433">to collected outcomes</text><rect fill="#F1F1F1" height="52.6882" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="179.4931" x="303.504" y="891.3593"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="159.4931" x="313.504" y="914.1874">Drop registration; rebalance</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="115.2368" x="313.504" y="930.5315">remaining collectors</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="144.6809" x="320.9101" y="964.0476"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="124.6809" x="330.9101" y="986.8757">Return values or error</text><ellipse cx="393.2506" cy="1031.3917" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="393.2506" cy="1031.3917" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="393.2506" x2="393.2506" y1="70.0679" y2="90.0679"/><polygon fill="#181818" points="389.2506,80.0679,393.2506,90.0679,397.2506,80.0679,393.2506,84.0679" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="393.2506" x2="393.2506" y1="142.7561" y2="162.7561"/><polygon fill="#181818" points="389.2506,152.7561,393.2506,162.7561,397.2506,152.7561,393.2506,156.7561" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="393.2506" x2="393.2506" y1="199.1003" y2="219.1003"/><polygon fill="#181818" points="389.2506,209.1003,393.2506,219.1003,397.2506,209.1003,393.2506,213.1003" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;st