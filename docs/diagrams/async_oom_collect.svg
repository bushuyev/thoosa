<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1053px" preserveAspectRatio="none" style="width:906px;height:1053px;background:#FFFFFF;" version="1.1" viewBox="0 0 906 1053" width="906px" zoomAndPan="magnify"><title>Adaptive concurrency: collector flow</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="255.443" x="323.9668" y="34.9659">Adaptive concurrency: collector flow</text></g><ellipse cx="393.2506" cy="60.0679" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="52.6882" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="243.2016" x="271.6498" y="90.0679"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="223.2016" x="281.6498" y="112.896">Register description with FuturesLimits;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="139.477" x="281.6498" y="129.2401">retain registration guard</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="228.7895" x="278.8559" y="162.7561"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208.7895" x="288.8559" y="185.5842">Clone watch receiver; read allowance</text><rect fill="#F1F1F1" height="52.6882" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="214.8334" x="285.8339" y="219.1003"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="90.3006" x="295.8339" y="241.9283">Fill JoinSet while</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="194.8334" x="295.8339" y="258.2725">tasks + ordered buffer &lt; allowance</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="259.1737" x="263.6637" y="349.0474"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="239.1737" x="273.6637" y="371.8755">Wait for watch change OR task completion</text><polygon fill="#F1F1F1" points="350.2354,405.3915,436.2658,405.3915,448.2658,417.3915,436.2658,429.3915,350.2354,429.3915,338.2354,417.3915,350.2354,405.3915" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="86.0304" x="350.2354" y="421.6595">Task completed?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.0829" x="321.1525" y="414.1685">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="71.7415" x="448.2658" y="414.1685">watch change</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="221.2655" x="129.0135" y="439.3915"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="201.2655" x="139.0135" y="462.2196">Record indexed result and progress</text><polygon fill="#F1F1F1" points="189.3436,495.7356,289.9489,495.7356,301.9489,507.7356,289.9489,519.7356,189.3436,519.7356,177.3436,507.7356,189.3436,495.7356" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="100.6053" x="189.3436" y="512.0036">Ordered collection?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.0829" x="160.2607" y="504.5127">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.4529" x="301.9489" y="504.5127">no</text><rect fill="#F1F1F1" height="52.6882" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="197.8533" x="38" y="529.7356"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="177.8533" x="48" y="552.5637">Buffer result; move consecutive</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="175.9453" x="48" y="568.9078">completed indices to outcomes</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="173.0251" x="255.8533" y="529.7356"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="153.0251" x="265.8533" y="552.5637">Append result to outcomes</text><polygon fill="#F1F1F1" points="239.6462,588.4239,251.6462,600.4239,239.6462,612.4239,227.6462,600.4239,239.6462,588.4239" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="175.9531" x="458.8784" y="439.3915"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="155.9531" x="468.8784" y="462.2196">Keep existing tasks running</text><polygon fill="#F1F1F1" points="393.2506,618.4239,405.2506,630.4239,393.2506,642.4239,381.2506,630.4239,393.2506,618.4239" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="141.8849" x="322.3082" y="662.4239"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="121.8849" x="332.3082" y="685.2519">Read latest allowance</text><path d="M537.1314,713.5531 L537.1314,741.1121 L517.1314,745.1121 L537.1314,749.1121 L537.1314,776.6711 A0,0 0 0 0 537.1314,776.6711 L868.3767,776.6711 A0,0 0 0 0 868.3767,776.6711 L868.3767,723.5531 L858.3767,713.5531 L537.1314,713.5531 A0,0 0 0 0 537.1314,713.5531" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M858.3767,713.5531 L858.3767,723.5531 L868.3